  nInnerIterations: [60,60]
  timeWindowLength: 1
  # blending is applied only at cycles where hour % blendingInterval == 0
  useBlending: True
  blendingTarget: "background"
  blendingInterval: 6
  # large-scale file: ECMWF init file at the valid time (analysis), so blendingFileFcstLength stays 0
  blendingLargeScaleFile: '/home/project/17001770/weather_department/cmd/ncar/taosun/regional_mpasjedi/R3km-SG/ICBC-1Hour/{{thisValidDate}}/x{{meshRatioOuter}}.{{nCellsOuter}}.init.{{thisMPASFileDate}}.nc'
  blendingFileFcstLength: 0
  radianceThinningDistance: 30
  minLat: -9.06518
  maxLat: 11.4725
  minLon: 91.7506
  maxLon: 112.268
  maxErrorObs: 5.0
  GNSSROHeightTop: 40000.0
  GNSSROHeightBottom: 2500.0
  observers: [
    ahi-cld_himawari9,
  ]
  covariance:
    R3km-SG:
      bumpCovControlVariables:
      - eastward_wind
      - northward_wind
      - air_temperature
      - water_vapor_mixing_ratio_wrt_moist_air
      - air_pressure_at_surface
      - cloud_liquid_water
      - cloud_liquid_ice
      - rain_water
      - snow_water
      - graupel
      bumpCovVBalPrefix: mpas
      bumpCovPrefix: mpas
      bumpCovDir: /home/project/13004327/workflow_service/MPAS-JEDI-EXPT/R3km-SG/BUMP/BUMP_StaticBEC_V4/BUMP_NICAS_MBE
      bumpCovStdDevFile: /home/project/13004327/workflow_service/MPAS-JEDI-EXPT/R3km-SG/BUMP/BUMP_StaticBEC_V4/BUMP_HDIAG_MBE/mpas.stddev.nc
      bumpCovVBalDir: /home/project/13004327/workflow_service/MPAS-JEDI-EXPT/R3km-SG/BUMP/BUMP_StaticBEC_V4/BUMP_VBAL_MBE
  post: []
forecast:
  post: []
  fcstLength: 1
  outputInterval: 1

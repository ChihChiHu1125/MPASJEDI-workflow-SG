enkf:
  job:
    defaults:
      nodes: 1
      PEPerNode: 128
      threads: 1
      baseSeconds: 1000
      secondsPerMember: 60
      memory: 440GB

      # cylc retry string
      retry: '0*PT30S'

    ## FORMAT
    #{{outerMesh}}:
    #  {{solver}}: # i.e., LETKF, GETKF
    #    observer:
    #      nodes: int
    #      PEPerNode: int
    #      #@ seconds = $secondsPerMember * members.n + $baseSeconds
    #      memory: int
    #      baseSeconds: int
    #      secondsPerMember: int, default is 0
    #    solver:
    #      nodes: int
    #      PEPerNode: int
    #      threads: int
    #      #@ seconds = $secondsPerMember * members.n + $baseSeconds
    #      memory: int
    #      baseSeconds: int
    #      secondsPerMember: int, default is 0
    ## All resource requests below are based on
    # + single-precision bundle build
    # + sondes, aircraft, sfc, gnssro, satwind, 6 clear amsua
    # These are starting points.  When more memory is needed (e.g., more observations, more
    # memmbers) than is available in default resource requests below, use more nodes and/or
    # processors
    #
    R3km-SG:
      LETKF:
        observer:
          nodes: 2
          PEPerNode: 128
          memory: 440GB
          baseSeconds: 120
          secondsPerMember: 30
        solver:
          nodes: 4
          PEPerNode: 128
          threads: 1
          memory: 440GB
          baseSeconds: 300
          secondsPerMember: 180
        diagoma:
          nodes: 2
          PEPerNode: 128
          memory: 440GB
          baseSeconds: 300
          secondsPerMember: 180
      GETKF:
        blending:
          nodes: 2
          PEPerNode: 128
          memory: 440GB
          seconds: 1800
        observer:
          nodes: 2
          PEPerNode: 128
          memory: 440GB
          baseSeconds: 240
          secondsPerMember: 180

          nodes: 4
          PEPerNode: 128
          threads: 1
          memory: 440GB
          baseSeconds: 600
          secondsPerMember: 240
        diagoma:
          nodes: 2
          PEPerNode: 128
          memory: 440GB
          baseSeconds: 120
          secondsPerMember: 60 

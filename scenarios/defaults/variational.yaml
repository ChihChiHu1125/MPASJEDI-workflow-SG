variational:
  ## mesh-specific settings
  ensemble: #(envar or hybrid)
    forecasts:
      ## resource (required)
      # use the format "{{project}}.{{source}}"
      # see below for options (e.g., "PANDAC.GEFS")
      resource: None

      #{{project}}:
      #  {{source}}:
      #    {{ensembleMesh}}:
      #      maxMembers: int
      #      directory0: str
      #      directory1: str
      #      #dateFormatter: str
      #      memberNDigits: int
      #      memberPrefix: str
      #      forecastDateOffsetHR: int

      # produces this filename:
      #  {{directory0}}/{{memberPrefix}}{{member}}/{{directory1}}/{{filePrefix}}.{{thisMPASFileDate}}.nc
      #
      #  where
      #    + {{member}} is an iterator formatted using {{memberNDigits}}
      #    + {{directory0}} or {{directory1}} may include {{prevDateTime}} for substitution
      #    + {{prevDateTime}} is the previous forecast date-time, formatted as YYMMDDHH, and depends on
      #      the forecastDateOffsetHR and workflow.CyclingWindowHR
      #    + {{thisMPASFileDate}} is formatted as YY-MM-DD_HH.00.00
      # For more details, see PrepVariational.csh and tools/substituteEnsembleBTemplate.py

      # common settings act as default values when not contained in {{project}}.{{source}}
      defaults:
        maxMembers: 0
        directory0: None #must override
        directory1: None
        #dateFormatter: 'YYYYMMDDHH' # not currently implemented
        filePrefix: mpasout
        memberPrefix: None # defaults to empty string
        memberNDigits: 0 # must override
        forecastDateOffsetHR: 0 # added to CyclingWindowHR, only non-zero for IAU

      SINGV:
        ECMWF:
          R3km-SG:
            maxMembers: 32
            directory0: '/home/project/17001770/weather_department/cmd/ncar/taosun/regional_mpasjedi/R3km-SG/ENS/{{prevDateTime}}' 
            filePrefix: mpasout
            memberPrefix: m_
            memberNDigits: 0
        ECMWF_1H:
          R3km-SG:
            maxMembers: 32
            directory0: '/home/project/17001770/weather_department/cmd/ncar/taosun/regional_mpasjedi/R3km-SG/ENS_1H/{{prevDateTime}}'
            filePrefix: mpasout
            memberPrefix: m_
            memberNDigits: 0
        LGETKF:
          R3km-SG:
            maxMembers: 32
            directory0: '/home/users/industry/ucar/taosun/scratch/regional_mpasjedi/taosun_lgetkf_Hourly_RadarDA_Control_fromMean_NoBLD/CyclingFC/{{prevDateTime}}'
            filePrefix: mpasout
            memberPrefix: mem
            memberNDigits: 3

    # externally-produced localization files
    localization:
      #{{ensembleMesh}}:
      #  bumpLocPrefix: str
      #  bumpLocDir: str
      R3km-SG:
        bumpLocPrefix: bumploc
        bumpLocDir: /home/project/17001770/weather_department/cmd/ncar/taosun/regional_mpasjedi/R3km-SG/BUMP/BUMP_ENSLOC/H300V4km 

  # externally-produced background covariance files (var or hybrid)
  covariance:
    bumpCovControlVariables:
    - northward_wind
    - eastward_wind 
    - uReconstructMeridional
    - air_temperature
    - water_vapor_mixing_ratio_wrt_moist_air
    - air_pressure_at_surface
    bumpCovPrefix: mpas
    bumpCovVBalPrefix: mpas_vbal
    #{{innerMesh}}:
    #  bumpCovDir: str
    #  bumpCovStdDevFile: str
    #  bumpCovVBalDir: str
    #  hybridCoefficientsDir: str
    R3km-SG:
      bumpCovControlVariables:
      - northward_wind 
      - eastward_wind 
      - air_temperature
      - water_vapor_mixing_ratio_wrt_moist_air
      - air_pressure_at_surface
      bumpCovPrefix: mpas
      hybridEnsembleWeightFile: /home/project/13004327/workflow_service/MPAS-JEDI-EXPT/R3km-SG/BUMP/BUMP_StaticBEC_V4/BUMP_WEIGHT/hyb_ens_bec_weight.nc
      hybridStaticWeightFile: /home/project/13004327/workflow_service/MPAS-JEDI-EXPT/R3km-SG/BUMP/BUMP_StaticBEC_V4/BUMP_WEIGHT/hyb_static_bec_weight.nc
      bumpCovDir: /home/project/13004327/workflow_service/MPAS-JEDI-EXPT/R3km-SG/BUMP/BUMP_StaticBEC_V4/BUMP_NICAS_MBE
      bumpCovStdDevFile: /home/project/13004327/workflow_service/MPAS-JEDI-EXPT/R3km-SG/BUMP/BUMP_StaticBEC_V4/BUMP_HDIAG_MBE/mpas.stddev.nc
      bumpCovVBalDir: /home/project/13004327/workflow_service/MPAS-JEDI-EXPT/R3km-SG/BUMP/BUMP_StaticBEC_V4/BUMP_VBAL_MBE

  # resource requirements
  job:
    defaults:
      baseSeconds: 1500
      secondsPerEnVarMember: 10
      nodes: 1
      PEPerNode: 128
      memory: 440GB

      # cylc retry string
      retry: '0*PT30S'


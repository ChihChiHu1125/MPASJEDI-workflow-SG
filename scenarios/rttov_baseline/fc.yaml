# MPAS forecast only: one forecast from an external initial condition, no H(x)/verification
#
# - initial condition: {{externalanalyses.directory}}/YYYYMMDDHH/*.YYYY-MM-DD_HH.00.00.nc
#   lateral boundary conditions: {{externalanalyses.directory}}/YYYYMMDDHH/lbc.*.nc,
#   every lbcIntervalHour out to lbcExtendedHour (must cover extendedforecast.lengthHR)
# - forecast output: {{ExperimentDirectory}}/ExtendedFC/YYYYMMDDHH/mean/{mpasout,diag}.*.nc,
#   every outIntervalHR hours (integer hours; lengthHR should be a multiple of it)
suite: ForecastFromExternalAnalyses
experiment:
  name: "fc"
members:
  n: 1
model:
  outerMesh: R3km-SG
  innerMesh: R3km-SG
  ensembleMesh: R3km-SG
externalanalyses:
  resource: "ECMWF.SINGV"
  resources:
    ECMWF:
      SINGV:
        R3km-SG:
          directory: "/home/project/13004327/workflow_service/MPAS-JEDI-EXPT/R3km-SG/ICBC"
          lbcIntervalHour: 1
          lbcExtendedHour: 24
extendedforecast:
  meanTimes: T12
  lengthHR: 24
  outIntervalHR: 1
  post: []
observations:
  resource: SINGV_NSCC_HOURLY
workflow:
  first cycle point: 20240918T12
  final cycle point: 20240925T12

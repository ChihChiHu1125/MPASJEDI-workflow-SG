_hor obs localization: &HorizObsLoc
  localization method: {{horizontalLocalizationMethod}}
  lengthscale: &HorizObsLocLengthScale {{horizontalLocalizationLengthscale}}
  max nobs: 1000

_hor cloud obs localization: &HorizObsLocCloud
  localization method: {{horizontalLocalizationMethod}}
  lengthscale: &HorizObsLocLengthScaleCloud {{horizontalLocalizationLengthscaleCloud}}
  max nobs: 1000

_height-based vertical localization: &HeightVertObsLoc
  localization method: Vertical localization
  vertical lengthscale: {{verticalLocalizationLengthscale}}
  ioda vertical coordinate: height
  ioda vertical coordinate group: MetaData
  localization function: {{verticalLocalizationFunction}}

_pressure-based vertical localization: &PressureVertObsLoc
  localization method: Vertical localization
  vertical lengthscale: {{verticalLocalizationLengthscaleLogp}}
  ioda vertical coordinate: pressure
  ioda vertical coordinate group: MetaData
  apply log transformation: true
  localization function: {{verticalLocalizationFunction}}

_2DHorizConv: &2DHorizConv
  obs localizations:
  - <<: *HorizObsLoc

_2DHorizCloud: &2DHorizCloud
  obs localizations:
  - <<: *HorizObsLocCloud

_2DPressureConv: &2DPressureConv
  obs localizations:
  - <<: *HorizObsLoc

_2DHeightConv: &2DHeightConv
  obs localizations:
  - <<: *HorizObsLoc

_2DPressureCloud: &2DPressureCloud
  obs localizations:
  - <<: *HorizObsLocCloud

_2DHeightCloud: &2DHeightCloud
  obs localizations:
  - <<: *HorizObsLocCloud

_3DPressureConv: &3DPressureConv
  obs localizations:
  - <<: *HorizObsLoc
  - <<: *PressureVertObsLoc

_3DHeightConv: &3DHeightConv
  obs localizations:
  - <<: *HorizObsLoc
  - <<: *HeightVertObsLoc

_3DPressureCloud: &3DPressureCloud
  obs localizations:
  - <<: *HorizObsLocCloud
  - <<: *PressureVertObsLoc

_3DHeightCloud: &3DHeightCloud
  obs localizations:
  - <<: *HorizObsLocCloud
  - <<: *HeightVertObsLoc

# horizontal localization only
_non-height-based obs localizations: &horizObsLoc
  <<: *2DHorizConv

_non-height-based cloud obs localizations: &horizObsLocCloud
  <<: *2DHorizCloud

# horizontal and vertical localization
_height-based obs localizations: &heightAndHorizObsLoc
  <<: *{{obsLocalizationDimension}}HeightConv

_pressure-based obs localizations: &pressureAndHorizObsLoc
  <<: *{{obsLocalizationDimension}}PressureConv 

_height-based cloud obs localizations: &heightAndHorizObsLocCloud
  <<: *{{obsLocalizationDimension}}HeightCloud

_pressure-based cloud obs localizations: &pressureAndHorizObsLocCloud
  <<: *{{obsLocalizationDimension}}PressureCloud

_round robin dist: &RoundRobinDistribution
  name: RoundRobin

_halo dist: &HaloDistribution
  name: Halo
  halo size: *HorizObsLocLengthScale

_obs space: &ObsSpace
  distribution: *{{ObsSpaceDistribution}}

_obs error diagonal: &ObsErrorDiagonal
  covariance model: diagonal

_clear crtm: &clearCRTMObsOperator
  name: CRTM
  SurfaceWindGeoVars: uv
  Absorbers: [H2O, O3]
  linear obs operator:
    Absorbers: [H2O]
  obs options: &CRTMObsOptions
    EndianType: little_endian
    CoefficientPath: {{CRTMTABLES}}
    IRVISlandCoeff: {{IRVISlandCoeff}}

_cloudy crtm: &cloudyCRTMObsOperator
  name: CRTM
  SurfaceWindGeoVars: uv
  Absorbers: [H2O, O3]
  Clouds: [Water, Ice, Rain, Snow, Graupel]
  Cloud_Seeding: true
  linear obs operator:
    Absorbers: [H2O]
    Clouds: [Water, Ice, Rain, Snow, Graupel]
  obs options:
    <<: *CRTMObsOptions

# RTTOVCPP: options are top-level (no "obs options"); SensorID and HydrotablePath are
# sensor-specific, so they are set in each ObsPlugs/*/baseRTTOV/ stub
_clear rttov: &clearRTTOVObsOperator
  name: RTTOVCPP
  CoefPath: {{RTTOVCoefPath}}
  Absorbers: [H2O]
  linear obs operator:
    Absorbers: [H2O]

# IRClouds and MWClouds are mutually exclusive within one RTTOVCPP operator (one hydrotable
# per RttovSafe instance), so IR/VIS and MW all-sky instruments use separate anchors
_cloudy rttov ir: &cloudyIRRTTOVObsOperator
  name: RTTOVCPP
  CoefPath: {{RTTOVCoefPath}}
  Absorbers: [H2O]
  IRClouds: [Water, Ice]
  LiquidCloudType: clwde
  UseModelEffectiveRadius: true
  ThermalSolver: delta_edd
  OverlapParam: auto_select
  linear obs operator:
    Absorbers: [H2O]
    IRClouds: [Water, Ice]

_cloudy rttov mw: &cloudyMWRTTOVObsOperator
  name: RTTOVCPP
  CoefPath: {{RTTOVCoefPath}}
  Absorbers: [H2O]
  MWClouds: [Water, Ice, Rain, Snow, Graupel]
  ThermalSolver: delta_edd
  OverlapParam: auto_select
  HydrotablePath: {{RTTOVHydrotableDir}}/hydrotable_mw/rttov_hydrotable_tropics_tropics.dat
  linear obs operator:
    Absorbers: [H2O]
    MWClouds: [Water, Ice, Rain, Snow, Graupel]

_get values: &GetValues
  nnearest: 3

_multi iteration filter: &multiIterationFilter
  _blank: null

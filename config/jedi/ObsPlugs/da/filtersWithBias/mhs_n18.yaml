  obs filters:
# Metadata Check
  - filter: Domain Check
    filter variables:
    - name: brightnessTemperature
      channels: 5
    where:
    - variable:
        name: MetaData/latitude
      minvalue: -60.0
      maxvalue: 60.0
    <<: *multiIterationFilter
# obs prior filters:
# Assign obs error for each channel
  - filter: Perform Action
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    action:
      name: assign error
      error parameter vector: [2.50, 2.50, 2.50, 2.00, 2.00]
    <<: *multiIterationFilter
# BennartzScatIndex check over land
  - filter: Bounds Check
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    where:
    - variable:
        name: GeoVaLs/water_area_fraction
      maxvalue: 0.99
    test variables:
    - name: ObsFunction/BennartzScatIndex
      options:
        channel_89ghz: 1
        channel_150ghz: 2
        bennartz_coeff_1: 0.158
        bennartz_coeff_2: 0.0163
        apply_bias: ObsBiasData
    maxvalue: 1.0
    action:
      name: reject
    <<: *multiIterationFilter
# BennartzScatIndex check over water
  - filter: Bounds Check
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    where:
    - variable:
        name: GeoVaLs/water_area_fraction
      minvalue: 1.0
    test variables:
    - name: ObsFunction/BennartzScatIndex
      options:
        channel_89ghz: 1
        channel_150ghz: 2
        bennartz_coeff_1: -39.2010
        bennartz_coeff_2: 0.1104
        apply_bias: ObsBiasData
    maxvalue: 10.0
    action:
      name: reject
    <<: *multiIterationFilter
# Topography check
  - filter: BlackList
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    action:
      name: inflate error
      inflation variable:
        name: ObsFunction/ObsErrorFactorTopoRad
        channels: *mhs_n18_channels
        options:
          sensor: mhs_n18
          channels: *mhs_n18_channels
    <<: *multiIterationFilter
# Transmittnace Top Check
  - filter: BlackList
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    action:
      name: inflate error
      inflation variable:
        name: ObsFunction/ObsErrorFactorTransmitTopRad
        channels: *mhs_n18_channels
        options:
          channels: *mhs_n18_channels
    <<: *multiIterationFilter
#  Useflag check
  - filter: Bounds Check
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    test variables:
    - name: ObsFunction/ChannelUseflagCheckRad
      channels: *mhs_n18_channels
      options:
        channels: *mhs_n18_channels
        use_flag: [ -1, -1, 1, 1,  1]
    minvalue: 1.0e-12
    action:
      name: reject
# Background check
  - filter: Background Check
    threshold: 3.0
    <<: *multiIterationFilter
# Thinning
  - filter: Gaussian_Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
    action:
      name: reduce obs space
# Regional domain check
  - filter: Bounds Check
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    test variables:
    - name: GeoVaLs/observable_domain_mask
    flag all filter variables if any test variable is out of bounds: true
    minvalue: 0.0
    maxvalue: 0.1
#  - filter: GOMsaver
#    filename: {{OutDBDir}}{{MemberDir}}/{{geoPrefix}}_mhs_n18.nc4
# Regional lat&lon check
  - *reduceObsSpace

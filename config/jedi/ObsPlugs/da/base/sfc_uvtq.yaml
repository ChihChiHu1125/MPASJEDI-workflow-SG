- obs space:
    <<: *ObsSpace
    name: Sfc_uvtq
    _obsdatain: &ObsDataIn
      engine:
        type: H5File
        obsfile: {{InDBDir}}/sfc_uvtq_obs_{{thisValidDate}}.h5
    _obsdataout: &ObsDataOut
      engine:
        type: H5File
        obsfile: {{OutDBDir}}{{MemberDir}}/{{obsPrefix}}_sfc_uvtq{{ObsOutSuffix}}.h5
    obsdatain: *{{ObsDataIn}}
    {{ObsDataOut}}
    simulated variables: [airTemperature, specificHumidity, windEastward, windNorthward]
  obs error: *ObsErrorDiagonal
  <<: *horizObsLoc
  obs operator:
    name: Composite
    components:
    - name: SfcCorrected
      correction scheme to use: WRFDA
      variables: [airTemperature]
    - name: VertInterp
      vertical coordinate: air_pressure
      observation vertical coordinate: pressure
      interpolation method: log-linear
      variables: [specificHumidity]
    - name: VertInterp
      vertical coordinate: air_pressure
      observation vertical coordinate: pressure
      interpolation method: log-linear
      hofx scaling field: wind_reduction_factor_at_10m
      hofx scaling field group: GeoVaLs
      variables: [windEastward, windNorthward]
  linear obs operator:
    name: Composite
    components:
    - name: Identity
      variables: [airTemperature]
    - name: VertInterp
      vertical coordinate: air_pressure
      observation vertical coordinate: pressure
      interpolation method: log-linear
      variables: [specificHumidity]
    - name: VertInterp
      vertical coordinate: air_pressure
      observation vertical coordinate: pressure
      interpolation method: log-linear
      hofx scaling field: wind_reduction_factor_at_10m
      hofx scaling field group: GeoVaLs
      variables: [windEastward, windNorthward]
    observation alias file: obsop_name_map.yaml
  get values:
    <<: *GetValues

- obs space:
    <<: *ObsSpace
    name: abi-cld_g16
    _obsdatain: &ObsDataIn
      engine:
        type: H5File
        obsfile: {{InDBDir}}/abi-cld_g16_obs_{{thisValidDate}}.h5
    _obsdataout: &ObsDataOut
      write multiple files: true
      engine:
        type: H5File
        obsfile: {{OutDBDir}}{{MemberDir}}/{{obsPrefix}}_abi-cld_g16{{ObsOutSuffix}}.h5
    obsdatain: *{{ObsDataIn}}
    {{ObsDataOut}}
    simulated variables: [brightnessTemperature]
    channels: &cldabi_g16_channels 8-10
  obs error: *ObsErrorDiagonal
  <<: *horizObsLoc
  obs operator:
    <<: *cloudyCRTMObsOperator
    obs options:
      <<: *CRTMObsOptions
      Sensor_ID: abi_g16
  get values:
    <<: *GetValues

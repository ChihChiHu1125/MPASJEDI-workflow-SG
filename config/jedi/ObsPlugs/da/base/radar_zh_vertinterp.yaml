- obs space:
    <<: *ObsSpace
    name: RadarDBZ
    _obsdatain: &ObsDataIn
      engine:
        type: H5File
        obsfile: {{InDBDir}}/radar_zh_vertinterp_obs_{{thisValidDate}}.h5
    _obsdataout: &ObsDataOut
      engine:
        type: H5File
        obsfile: {{OutDBDir}}{{MemberDir}}/{{obsPrefix}}_radar_zh_vertinterp{{ObsOutSuffix}}.h5
    obsdatain:
      <<: *{{ObsDataIn}}
    {{ObsDataOut}}
    simulated variables: [equivalentReflectivityFactor]
  obs error: *ObsErrorDiagonal
  <<: *heightAndHorizObsLoc
  obs operator:
    name: VertInterp
    observation vertical coordinate: height
    vertical coordinate: geometric_height
    interpolation method: linear
  get values:
    <<: *GetValues

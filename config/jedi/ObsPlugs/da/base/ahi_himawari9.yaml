- obs space:
    <<: *ObsSpace
    name: ahi_himawari9
    _obsdatain: &ObsDataIn
      engine:
        type: H5File
        obsfile: {{InDBDir}}/ahi_himawari9_obs_{{thisValidDate}}.h5
    _obsdataout: &ObsDataOut
      write multiple files: true
      engine:
        type: H5File
        obsfile: {{OutDBDir}}{{MemberDir}}/{{obsPrefix}}_ahi_himawari9{{ObsOutSuffix}}.h5
    obsdatain: *{{ObsDataIn}}
    {{ObsDataOut}}
    simulated variables: [brightnessTemperature]
    channels: &clrahi_himawari9_channels 8-10
  obs error: *ObsErrorDiagonal
  <<: *horizObsLoc
  obs operator:
    <<: *clearCRTMObsOperator
    obs options:
      <<: *CRTMObsOptions
      Sensor_ID: ahi_himawari9
  get values:
    <<: *GetValues

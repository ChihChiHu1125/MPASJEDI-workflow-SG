- obs space:
    <<: *ObsSpace
    name: ClearRadarReflectivity
    _obsdatain: &ObsDataIn
      engine:
        type: H5File
        obsfile: {{InDBDir}}/radar_zh_clear_lin_obs_{{thisValidDate}}.h5
    _obsdataout: &ObsDataOut
      write multiple files: true
      engine:
        type: H5File
        obsfile: {{OutDBDir}}{{MemberDir}}/{{obsPrefix}}_radar_zh_clear_lin{{ObsOutSuffix}}.h5
    obsdatain:
      <<: *{{ObsDataIn}}
    {{ObsDataOut}}
    simulated variables: [equivalentReflectivityFactor]
  obs error: *ObsErrorDiagonal
  <<: *heightAndHorizObsLoc
  obs operator:
    name: DirectZDA
    microphysics option: Lin
    use variational method: true
    var_rain_mixing_ratio: mixing_ratio_of_rain
    var_snow_mixing_ratio: mixing_ratio_of_snow
    var_graupel_mixing_ratio: mixing_ratio_of_graupel
    var_rain_number_concentration: rain_number_concentration

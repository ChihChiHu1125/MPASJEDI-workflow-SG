  obs filters:
  - filter: Domain Check
    where:
    - variable:
        name: MetaData/sensorZenithAngle
      maxvalue: 60.0
  - filter: Gaussian Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
    action:
      name: reduce obs space
  - filter: Perform Action
    <<: *multiIterationFilter
    filter variables:
    - name: brightnessTemperature
      channels: *cldahi_himawari9_channels
    action:
      name: assign error
      _symmetric cld fits 3km: &ahi_himawari9_SymmCldFits-3km
## 3 km, bias correction - from Xuewei Zhang for 8-10 channels
        x0: [0.5, 0.5, 0.5, 0.5]
        x1: [17.00, 22.50, 27.50, 36.0]
        err0: [3.00, 3.50, 3.10, 2.56]
        err1: [13.40, 16.80, 20.00, 40.5]  
      error function:
        name: ObsFunction/ObsErrorModelRamp
        channels: *cldahi_himawari9_channels
        options:
          <<: *ahi_himawari9_SymmCldFits-3km
          channels: *cldahi_himawari9_channels
          xvar:
            name: ObsFunction/SymmCldImpact
            channels: *cldahi_himawari9_channels
            options:
              channels: *cldahi_himawari9_channels
              btlim: [234.0, 246.0, 258.8, 292]        

  - filter: Bounds Check
    filter variables:
    - name: brightnessTemperature
      channels: *cldahi_himawari9_channels
    test variables:
    - name: GeoVaLs/observable_domain_mask
    flag all filter variables if any test variable is out of bounds: true
    minvalue: 0.0
    maxvalue: 0.1
  - filter: Background Check
    threshold: 3.0
    <<: *multiIterationFilter
  - *reduceObsSpace

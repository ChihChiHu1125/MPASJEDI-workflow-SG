  obs filters:
  - filter: PreQC
    minvalue: 0
    maxvalue: 9
  - filter: Difference Check
    reference: MetaData/stationElevation
    value: GeoVaLs/surface_altitude
    threshold: 200.0
  # Assign observation errors
  - filter: Perform Action
    filter variables:
    - name: airTemperature
    action:
      name: assign error
      error parameter: 2.0
  - filter: Perform Action
    filter variables:
    - name: windEastward
    action:
      name: assign error
      error parameter: 2.0
  - filter: Perform Action
    filter variables:
    - name: windNorthward
    action:
      name: assign error
      error parameter: 2.0
  - filter: Perform Action
    filter variables:
    - name: specificHumidity
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelHumidity
        options:
          xvar:
            name: MetaData/pressure
          xvals: [100000, 85000, 70000, 50000]
          errors: [0.20, 0.20, 0.25, 0.30]
          Method: UKMO
  # Bounds check
  - filter: Bounds Check
    filter variables:
    - name: airTemperature
    minvalue: 200.0
    maxvalue: 400.0
  - filter: Bounds Check
    filter variables:
    - name: windEastward
    - name: windNorthward
    minvalue: -50.0
    maxvalue: 50.0
  - filter: Bounds Check
    filter variables:
    - name: specificHumidity
    minvalue: 0.0
    maxvalue: 1.0
  # Regional domain check
  - filter: Bounds Check
    filter variables:
    - name: airTemperature
    - name: specificHumidity
    - name: windEastward
    - name: windNorthward
    test variables:
    - name: GeoVaLs/observable_domain_mask
    flag all filter variables if any test variable is out of bounds: true
    minvalue: 0.0
    maxvalue: 0.1
  - filter: Background Check
    threshold: {{MaxErrorObs}}
    <<: *multiIterationFilter
  - *reduceObsSpace

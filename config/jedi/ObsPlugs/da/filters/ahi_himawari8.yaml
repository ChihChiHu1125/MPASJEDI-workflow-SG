  obs filters:
  - filter: Domain Check
    where:
    - variable:
        name: MetaData/sensorZenithAngle
      maxvalue: 60.0
    - variable:
        name: MetaData/cloudAmount
      maxvalue: 0.01
  - filter: Perform Action
    <<: *multiIterationFilter
    filter variables:
    - name: [brightnessTemperature_8]
    action:
      name: assign error
      error parameter: 0.87
  - filter: Perform Action
    <<: *multiIterationFilter
    filter variables:
    - name: [brightnessTemperature_9]
    action:
      name: assign error
      error parameter: 0.81
  - filter: Perform Action
    <<: *multiIterationFilter
    filter variables:
    - name: [brightnessTemperature_10]
    action:
      name: assign error
      error parameter: 0.72
  - filter: Gaussian Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
    action:
      name: reduce obs space
  - filter: Bounds Check
    filter variables:
    - name: brightnessTemperature
      channels: *clrahi_himawari8_channels
    test variables:
    - name: GeoVaLs/observable_domain_mask
    flag all filter variables if any test variable is out of bounds: true
    minvalue: 0.0
    maxvalue: 0.1
  - filter: Background Check
    threshold: {{MaxErrorObs}}
    <<: *multiIterationFilter
#  - filter: GOMsaver
#    filename: {{OutDBDir}}{{MemberDir}}/{{geoPrefix}}_ahi-clr_himawari8.nc4
  - filter: YDIAGsaver
    filename: {{OutDBDir}}{{MemberDir}}/{{diagPrefix}}_ahi-clr_himawari8.nc4
    filter variables:
    - name: brightness_temperature_assuming_clear_sky
      channels: *clrahi_himawari8_channels
    - name: weightingfunction_of_atmosphere_layer
      channels: *clrahi_himawari8_channels
    - name: pressure_level_at_peak_of_weightingfunction
      channels: *clrahi_himawari8_channels
    - name: brightness_temperature_jacobian_air_temperature
      channels: *clrahi_himawari8_channels
    - name: brightness_temperature_jacobian_humidity_mixing_ratio
      channels: *clrahi_himawari8_channels
    - name: brightness_temperature_jacobian_surface_emissivity
      channels: *clrahi_himawari8_channels
    - name: brightness_temperature_jacobian_surface_temperature
      channels: *clrahi_himawari8_channels
  - *reduceObsSpace

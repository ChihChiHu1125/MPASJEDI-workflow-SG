  obs filters:
  - filter: PreQC
    maxvalue: 3
  - filter: Bounds Check
    filter variables:
    - name: equivalentReflectivityFactor
    test variables:
    - name: GeoVaLs/observable_domain_mask
    flag all filter variables if any test variable is out of bounds: true
    minvalue: 0.0
    maxvalue: 0.1
  - filter: Perform Action
    filter variables:
    - name: equivalentReflectivityFactor
    action:
      name: assign error
      error parameter: 3.0
  - filter: Bounds Check
    filter variables:
    - name: equivalentReflectivityFactor
    maxvalue: 75.0
    minvalue: 0.01
  - filter: Bounds Check
    test variables:
    - name: ObsValue/copolarCorrelationCoefficient
    minvalue: 0.95
  - filter: Background Check
    threshold: 10.0
    <<: *multiIterationFilter
  - *reduceObsSpace

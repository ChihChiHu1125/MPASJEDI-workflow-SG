  obs filters:
  - filter: PreQC
    maxvalue: 3
  - filter: Bounds Check
    filter variables:
    - name: radialVelocity
    test variables:
    - name: GeoVaLs/observable_domain_mask
    flag all filter variables if any test variable is out of bounds: true
    minvalue: 0.0
    maxvalue: 0.1
  - filter: Perform Action
    filter variables:
    - name: radialVelocity
    action:
      name: assign error
      error parameter: 1.5
  - filter: Bounds Check
    test variables:
    - name: ObsValue/equivalentReflectivityFactor
    minvalue: 15.0 
  - filter: Background Check
    threshold: 10.0
    <<: *multiIterationFilter
  - *reduceObsSpace

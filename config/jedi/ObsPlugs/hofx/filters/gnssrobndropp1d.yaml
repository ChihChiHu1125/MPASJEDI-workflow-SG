  obs filters:
  - filter: Domain Check
    where:
    - variable:
        name: MetaData/impactHeightRO
      minvalue: {{GNSSROHeightBottom}}
      maxvalue: {{GNSSROHeightTop}}
    - variable:
        name: MetaData/earthRadiusCurvature
      minvalue: 6250000.0
      maxvalue: 6450000.0
    - variable:
        name: MetaData/geoidUndulation
      minvalue: -200.0
      maxvalue: 200.0
  - filter: ROobserror
    filter variables:
    - name: bendingAngle
    errmodel: NRL
  - filter: Bounds Check
    filter variables:
    - name: bendingAngle
    test variables:
    - name: GeoVaLs/observable_domain_mask
    flag all filter variables if any test variable is out of bounds: true
    minvalue: 0.0
    maxvalue: 0.1
  - filter: Background Check
    threshold: 10.0
    <<: *multiIterationFilter


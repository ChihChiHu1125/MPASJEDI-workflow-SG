- obs space:
    <<: *ObsSpace
    name: ahi-cld_himawari8
    obsdatain:
      engine:
        type: H5File
        obsfile: {{InDBDir}}/ahi-cld_himawari8_obs_{{thisValidDate}}.h5
    obsdataout:
      write multiple files: true
      engine:
        type: H5File
        obsfile: {{OutDBDir}}/{{obsPrefix}}_ahi-cld_himawari8.h5
    simulated variables: [brightnessTemperature]
    channels: &cldahi_channels 7-16
  obs error: *ObsErrorDiagonal
  obs operator:
    <<: *cloudyCRTMObsOperator
    obs options:
      <<: *CRTMObsOptions
      Sensor_ID: ahi_himawari8
  get values:
    <<: *GetValues

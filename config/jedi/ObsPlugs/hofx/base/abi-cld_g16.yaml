- obs space:
    <<: *ObsSpace
    name: abi-cld_g16
    obsdatain:
      engine:
        type: H5File
        obsfile: {{InDBDir}}/abi-cld_g16_obs_{{thisValidDate}}.h5
    obsdataout:
      write multiple files: true
      engine:
        type: H5File
        obsfile: {{OutDBDir}}/{{obsPrefix}}_abi-cld_g16.h5
    simulated variables: [brightnessTemperature]
    channels: &cldabi_channels 7-16
  obs error: *ObsErrorDiagonal
  obs operator:
    <<: *cloudyCRTMObsOperator
    obs options:
      <<: *CRTMObsOptions
      Sensor_ID: abi_g16
  get values:
    <<: *GetValues

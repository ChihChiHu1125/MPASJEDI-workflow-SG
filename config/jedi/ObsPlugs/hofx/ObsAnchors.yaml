_obs space: &ObsSpace
  obs perturbations seed: 1
  io pool:
    max pool size: {{maxIODAPoolSize}}
  distribution:
    name: RoundRobin
_obs error diagonal: &ObsErrorDiagonal
  covariance model: diagonal
_clear crtm: &clearCRTMObsOperator
  name: CRTM
  SurfaceWindGeoVars: uv
  Absorbers: [H2O, O3]
  obs options: &CRTMObsOptions
    EndianType: little_endian
    CoefficientPath: {{CRTMTABLES}}
    IRVISlandCoeff: {{IRVISlandCoeff}}
_cloudy crtm: &cloudyCRTMObsOperator
  name: CRTM
  SurfaceWindGeoVars: uv
  Absorbers: [H2O, O3]
  Clouds: [Water, Ice, Rain, Snow, Graupel]
  # false, consistent with variational/ObsAnchors.yaml (3DVar)
  Cloud_Seeding: false
  obs options:
    <<: *CRTMObsOptions
# RTTOVCPP: options are top-level (no "obs options"); SensorID and HydrotablePath are
# sensor-specific, so they are set in each ObsPlugs/*/baseRTTOV/ stub
_clear rttov: &clearRTTOVObsOperator
  name: RTTOVCPP
  CoefPath: {{RTTOVCoefPath}}
  Absorbers: [H2O]
# IRClouds and MWClouds are mutually exclusive within one RTTOVCPP operator (one hydrotable
# per RttovSafe instance), so IR/VIS and MW all-sky instruments use separate anchors
_cloudy rttov ir: &cloudyIRRTTOVObsOperator
  name: RTTOVCPP
  CoefPath: {{RTTOVCoefPath}}
  Absorbers: [H2O]
  IRClouds: [Water, Ice]
  LiquidCloudType: clwde
  UseModelEffectiveRadius: true
  # ice optics: baum (Deff from model re_ice) | baran (IWC+T, re_ice ignored);
  # set by observations.RTTOVIceScheme / RTTOVBaranIceVersion (defaults baum / baran2018)
  IceScheme: {{RTTOVIceScheme}}
  BaranIceVersion: {{RTTOVBaranIceVersion}}
  # IR ice cloud = sum of these; [Ice, Snow, Graupel] => qi+qs+qg;
  # set by observations.RTTOVIceCloudComponents (default [Ice])
  IceCloudComponents: [{{RTTOVIceCloudComponents}}]
  ThermalSolver: delta_edd
  OverlapParam: auto_select
_cloudy rttov mw: &cloudyMWRTTOVObsOperator
  name: RTTOVCPP
  CoefPath: {{RTTOVCoefPath}}
  Absorbers: [H2O]
  MWClouds: [Water, Ice, Rain, Snow, Graupel]
  ThermalSolver: delta_edd
  OverlapParam: auto_select
_get values: &GetValues
  nnearest: 3
_multi iteration filter: &multiIterationFilter
  _blank: null

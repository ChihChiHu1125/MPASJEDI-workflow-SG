  # CRTM: GeoVaLs (model profiles at obs locations) and ydiags (Jacobians);
  # only added when ahi-cld_himawari9 is in observations.saveGeoValsYDiagsInstruments
  # hydrometeor Jacobians are dBT/d(layer mass content, kg/m^2), i.e., per layer, not per kg/kg
  - filter: GOMsaver
    filename: {{OutDBDir}}/{{geoPrefix}}_ahi-cld_himawari9.nc4
  - filter: YDIAGsaver
    filename: {{OutDBDir}}/{{diagPrefix}}_ahi-cld_himawari9.nc4
    filter variables:
    - name: brightness_temperature_assuming_clear_sky
      channels: *cldahi_himawari9_channels
    - name: brightness_temperature_jacobian_air_temperature
      channels: *cldahi_himawari9_channels
    - name: brightness_temperature_jacobian_water_vapor_mixing_ratio_wrt_dry_air
      channels: *cldahi_himawari9_channels
    - name: brightness_temperature_jacobian_mass_content_of_cloud_liquid_water_in_atmosphere_layer
      channels: *cldahi_himawari9_channels
    - name: brightness_temperature_jacobian_mass_content_of_cloud_ice_in_atmosphere_layer
      channels: *cldahi_himawari9_channels
    - name: brightness_temperature_jacobian_mass_content_of_rain_in_atmosphere_layer
      channels: *cldahi_himawari9_channels
    - name: brightness_temperature_jacobian_mass_content_of_snow_in_atmosphere_layer
      channels: *cldahi_himawari9_channels
    - name: brightness_temperature_jacobian_mass_content_of_graupel_in_atmosphere_layer
      channels: *cldahi_himawari9_channels
    - name: brightness_temperature_jacobian_surface_emissivity
      channels: *cldahi_himawari9_channels
    - name: brightness_temperature_jacobian_skin_temperature_at_surface
      channels: *cldahi_himawari9_channels

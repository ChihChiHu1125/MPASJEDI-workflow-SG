# ObsAnchors and ObsErrorAnchors are automatically prepended above this line
_member: &memberConfig
  date: &analysisDate {{thisISO8601Date}}
  state variables: [{{StateVariables}}]
  stream name: background

_as observer: &asObserver
  run as observer only: true
  update obs config with geometry info: false
  use control member: {{useControlMember}}
  recenter control member: {{recenterToControl}}

_as solver: &asSolver
  read HX from disk: true
  do posterior observer: false
  save posterior ensemble: true
  save posterior mean: true
  use control member: {{useControlMember}}
  recenter control member: {{recenterToControl}}

_as solver LETKF: &asLETKF
  solver: LETKF
 
_as solver GETKF: &asGETKF
  solver: GETKF
  vertical localization: # only used by GETKF solver
    fraction of retained variance: {{fractionOfRetainedVariance}}
    lengthscale: {{verticalLocalizationLengthscale}}
    lengthscale units: {{verticalLocalizationLengthscaleUnits}}

_2d geometry: &2DGeometry
  iterator dimension: 2

_3d geometry: &3DGeometry
  iterator dimension: 3

geometry:
  <<: *{{obsLocalizationDimension}}Geometry
  nml_file: {{EnKFNamelistFile}}
  streams_file: {{EnKFStreamsFile}}
  deallocate non-da fields: true

time window:
  begin: {{windowBegin}}
  length: {{windowLength}}

background:
  members from template:
    template:
      <<: *memberConfig
      filename: {{ensembleStateDir}}/mem%iMember%/{{ensembleStatePrefix}}.$Y-$M-$D_$h.$m.$s.nc
    pattern: %iMember%
    zero padding: {{MemNDigits}}
    nmembers: {{NumEnsMember}}
    except: [{{controlMemberIndex}}]

control member:
  filename: {{ensembleStateDir}}/mem000/{{ensembleStatePrefix}}.$Y-$M-$D_$h.$m.$s.nc
  <<: *memberConfig

increment variables: [{{AnalysisVariables}}]

observations:
  observers:
{{Observers}}

driver: *{{driver}}

local ensemble DA:
  <<: *{{LocalEnKFSolver}}
  use linear observer: {{useLinearOperator}}
  inflation:
    rtps: {{rtpsValue}}
    rtpp: {{rtppValue}}
    mult: {{multValue}}

output:
  filename: {{anStateDir}}/mem%{member}%/{{anStatePrefix}}.$Y-$M-$D_$h.$m.$s.nc
  stream name: analysis
